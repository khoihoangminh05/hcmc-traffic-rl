# Quận 4 — MAPPO MICRO next-hop (MAIN train)
# Research: .docs/RESEARCH_ONE_PAPER.md · Sol1: .docs/SOL1_MAPPO.md
# data_tag: mappo_micro_v1
#
#   CUDA_VISIBLE_DEVICES=1 python -u -m marl_agent.mappo_micro_train \
#     --config marl_agent/configs/quan4_mappo_micro.yaml --device cuda

experiment:
  name: quan4_mappo_micro
  data_tag: mappo_micro_v1
  seed: 42
  device: auto
  output_root: artifacts/out/quan4/marl_runs

data:
  graph: artifacts/out/quan4/wcc/alley_graph_wcc.json
  density: artifacts/out/quan4/wcc/alley_density_l4_cam_wcc.json
  density_by_peak:
    morning: artifacts/out/quan4/wcc/alley_density_peak_morning_paper_a_merged_wcc.json
    afternoon: artifacts/out/quan4/wcc/alley_density_peak_afternoon_paper_a_merged_wcc.json
    evening: artifacts/out/quan4/wcc/alley_density_peak_evening_paper_a_merged_wcc.json
  require_l1_catalog: true
  seeds: ../ingestion-worker/config/od_pairs.quan4.seeds_l3.json
  t_train: [25200, 28800, 32400, 46800, 50400, 61200, 64800, 68400]
  t_eval: [28800, 50400, 64800]
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    min_path_edges: 6
    min_length_m: 400
    require_path: true
    max_pairs: 500

env:
  n_agents: 16
  # Cover nearly all nodes (pct outdeg>8 is tiny); neighbors ordered by free-time
  max_degree: 8
  # hops p90~57 max~76; headroom for congestion detours / no infinite loops
  max_steps: 120
  compact_dim: 128
  bpr_alpha: 0.15
  bpr_beta: 4.0
  bpr_load_cap: 12.0
  corridor_prob: 0.4
  reward_weights:
    w_T: 1.0
    w_C: 0.08
    w_R: 0.05
    w_step: 0.01
    arrive_bonus: 0.5

model:
  hidden: 256

optim:
  lr_actor: 3.0e-4
  lr_critic: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0

ppo:
  rollout_episodes: 64
  ppo_epochs: 4
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.03
  gamma: 0.99
  gae_lambda: 0.95
  normalize_advantage: true

train:
  max_updates: 3000
  eval_every: 25
  log_every: 1
  save_every: 50

early_stopping:
  enabled: true
  patience: 30
  min_delta: 1.0
  restore_best: true

baseline:
  run_on_eval: true
