# Quận 4 — MAPPO MICRO next-hop (MAIN train) v2
# Research: .docs/RESEARCH_ONE_PAPER.md · Sol1: .docs/SOL1_MAPPO.md
# data_tag: mappo_micro_v2
# Fixes vs v1: live occupancy obs, per-agent GAE, BC greedy warm-start, stronger cong/progress.
#
#   CUDA_VISIBLE_DEVICES=1 python -u -m marl_agent.mappo_micro_train \
#     --config marl_agent/configs/quan4_mappo_micro.yaml --device cuda

experiment:
  name: quan4_mappo_micro
  data_tag: mappo_micro_v2
  seed: 42
  device: auto
  output_root: artifacts/out/quan4/marl_runs

data:
  graph: artifacts/out/quan4/wcc/alley_graph_wcc.json
  density: artifacts/out/quan4/wcc/alley_density_l4_cam_wcc.json
  density_by_peak:
    morning: artifacts/out/quan4/wcc/alley_density_peak_morning_paper_a_merged_wcc.json
    afternoon: artifacts/out/quan4/wcc/alley_density_peak_afternoon_paper_a_merged_wcc.json
    evening: artifacts/out/quan4/wcc/alley_density_peak_evening_paper_a_merged_wcc.json
  require_l1_catalog: true
  seeds: ../ingestion-worker/config/od_pairs.quan4.seeds_l3.json
  t_train: [25200, 28800, 32400, 46800, 50400, 61200, 64800, 68400]
  t_eval: [28800, 50400, 64800]
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    min_path_edges: 6
    min_length_m: 400
    require_path: true
    max_pairs: 500

env:
  n_agents: 16
  max_degree: 8
  max_steps: 120
  compact_dim: 160
  bpr_alpha: 0.15
  bpr_beta: 4.0
  bpr_load_cap: 12.0
  corridor_prob: 0.35
  reward_weights:
    w_T: 1.0
    w_C: 0.35
    w_R: 0.05
    w_step: 0.02
    arrive_bonus: 2.0
    w_progress: 0.4
    w_revisit: 0.25
    w_team: 0.15

model:
  hidden: 256

optim:
  lr_actor: 2.0e-4
  lr_critic: 8.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0

bc:
  enabled: true
  updates: 80
  episodes_per_update: 24

ppo:
  rollout_episodes: 96
  n_envs: 24
  use_subproc: true
  minibatch_size: 8192
  ppo_epochs: 4
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.05
  gamma: 0.99
  gae_lambda: 0.95
  normalize_advantage: true

train:
  max_updates: 3000
  eval_every: 25
  log_every: 1
  save_every: 50

early_stopping:
  enabled: true
  patience: 40
  min_delta: 1.0
  restore_best: true

baseline:
  run_on_eval: true
  n_episodes: 30
