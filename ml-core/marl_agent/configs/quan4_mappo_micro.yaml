# Quận 4 — MAPPO MICRO next-hop (MAIN train) v2d
# Research: .docs/RESEARCH_ONE_PAPER.md · Sol1: .docs/SOL1_MAPPO.md
# data_tag: mappo_micro_v2d
#
# Root cause (v1–v2c): BC never cloned Dijkstra (CE~0.87 ≈ acc~0.42) so long
# OD paths (~36 hops) fail; PPO then trains a random-ish policy. Fixed BC reaches
# acc≥0.98 / greedy arr≈1.0. v2d: accuracy-gated BC, critic fit, softer PPO.
#
#   CUDA_VISIBLE_DEVICES=1 python -u -m marl_agent.mappo_micro_train \
#     --config marl_agent/configs/quan4_mappo_micro.yaml --device cuda

experiment:
  name: quan4_mappo_micro
  data_tag: mappo_micro_v2d
  seed: 42
  device: auto
  output_root: artifacts/out/quan4/marl_runs

data:
  graph: artifacts/out/quan4/wcc/alley_graph_wcc.json
  density: artifacts/out/quan4/wcc/alley_density_l4_cam_wcc.json
  density_by_peak:
    morning: artifacts/out/quan4/wcc/alley_density_peak_morning_paper_a_merged_wcc.json
    afternoon: artifacts/out/quan4/wcc/alley_density_peak_afternoon_paper_a_merged_wcc.json
    evening: artifacts/out/quan4/wcc/alley_density_peak_evening_paper_a_merged_wcc.json
  require_l1_catalog: true
  seeds: ../ingestion-worker/config/od_pairs.quan4.seeds_l3.json
  t_train: [25200, 28800, 32400, 46800, 50400, 61200, 64800, 68400]
  t_eval: [28800, 50400, 64800]
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    min_path_edges: 6
    min_length_m: 400
    require_path: true
    max_pairs: 500

env:
  n_agents: 16
  max_degree: 8
  max_steps: 200
  compact_dim: 160
  bpr_alpha: 0.15
  bpr_beta: 4.0
  bpr_load_cap: 12.0
  corridor_prob: 0.35
  reward_weights:
    w_T: 1.0
    w_C: 0.35
    w_R: 0.05
    w_step: 0.02
    arrive_bonus: 2.0
    w_progress: 0.4
    w_revisit: 0.25
    w_team: 0.15
    truncate_fail_mult: 4.0
    truncate_fail_floor: 8000.0

model:
  hidden: 256

optim:
  # Keep actor LR low so PPO does not erase a good Dijkstra clone.
  lr_actor: 5.0e-5
  lr_critic: 5.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0

bc:
  enabled: true
  teacher: dijkstra
  updates: 120
  episodes_per_update: 24
  lr: 1.0e-3
  target_acc: 0.98
  epochs_per_update: 4
  critic_fit_episodes: 48
  min_arrival_rate: 0.85

ppo:
  rollout_episodes: 96
  n_envs: 24
  use_subproc: true
  minibatch_size: 8192
  ppo_epochs: 3
  clip_eps: 0.1
  value_coef: 0.5
  # Low entropy: high entropy after BC destroys the clone within ~100 updates.
  entropy_coef: 0.02
  gamma: 0.99
  gae_lambda: 0.95
  normalize_advantage: true

train:
  max_updates: 3000
  eval_every: 25
  log_every: 1
  save_every: 50

early_stopping:
  enabled: true
  patience: 40
  min_delta: 50.0
  arrival_penalty: 12000.0
  restore_best: true

baseline:
  run_on_eval: true
  n_episodes: 30
