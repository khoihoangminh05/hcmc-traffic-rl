# Quận 4 — MAPPO micro next-hop. data_tag: mappo_micro_v3v
# v3v = v3u with independent training episodes per seed (v3u seeds shared an
# offset copy of the same episode stream). Environment and reward unchanged.
#
# 50 vehicles. MAPPO starts from scratch. greedy_load, greedy_informed,
# Dijkstra and random are scored at the end, not cloned first. Do not resume v3s/v3t.
# v3s seed 43 stuck at 0.81 arrival. Diag: when failing cars disagree with
# greedy_load, greedy wanted an alley 98% of the time; the cars circle a
# ~5-node block ~38 times, because one more lap (~20-30s) always looks cheaper
# than entering an occupied narrow alley (25.6s pile penalty per occupant).
# That is an exploration failure: the policy never tries the alternatives long
# enough to value them. v3u adds an episodic count-based exploration bonus
# (re-entering a node visited k >= 2 times costs 5s · (k − 1)), annealed to 0
# over 600 updates so the final policy optimises the true reward. Score and
# baselines unchanged.
# v3s = v3r transition and reward, unchanged (baselines identical). v3r seed 43
# locked at update ~50 with ~20% of cars circling ~6-node blocks; seeds 42/44
# converged. v3s anneals the entropy bonus 0.03 -> 0.005 over 400 updates and
# counts visits up to 20 instead of 5. A cap on revisits was rejected: it made
# greedy_load 8% worse (it circles a jammed block up to 11 times and arrives).
# v3q diag: failing cars ping-ponged A->B->A on short links (88% in a <=3-node
# loop). v3r adds "came from" and "visited" per exit, a physical U-turn time,
# and a smaller PPO step.
# Fairness: an accident is not visible before it starts. School and resident
# timetables are visible to MAPPO, and greedy_informed uses the same timetable,
# so a win over it is not extra information.
# v3n collapsed: truncation cost max(8000, 4·remain) was flat for every trip
# here, so the policy bounced on short links (fleet ≈ 8183s, nobody arrived).
# Truncation is now base + 4·remain, so each second still to go costs.
# v3o reached 0.81 arrival, then slid to 0.78 with more looping. v3p cuts a
# trip on its own time budget and adds potential-based progress shaping.
# Step only rebuilds obs for vehicles about to act; merge pressure is cached.
# Reward for every controller is realized travel time plus the pile penalty.
# A light is only a place in the observation. Phase and cycle are applied
# when a vehicle arrives and is not its destination. greedy_load skips that
# node when another exit exists. An alley holds length/jam_spacing vehicles;
# a full alley refuses entry and the wait is travel time.
#
# v3a/v3b runs are not paper evidence. v3a locked every vehicle to one hop per
# step and forgot vehicles still inside an alley. v3b fixed the clock but kept
# N=16 on a single edge.
# v3 = MDP fix (not gate tuning). Probe (marl_agent.probe_mdp_alignment, val n=24):
#   - free-flow progress shaping corr with -BPR travel = -0.40 (pushed the wrong way);
#     an older marginal return double-counted delay. This config's return is
#     realized travel plus the pile penalty, for every controller.
#   - v1–v2h "dijkstra" next-hop ignored edge cost: 11.8% worse than real Dijkstra,
#     and BC cloned it. Fixed (argmin free_t(u,v) + remain(v)).
#   - static congestion-aware Dijkstra gains 0%: congestion is the fleet itself
#     (same-OD platoons in lockstep, BPR quartic on cap 2.5 alleys)
#   - same-OD co-located agents had identical obs → a shared deterministic policy
#     could never split a platoon. Obs now carries rank-ordered contention per exit;
#     argmin(regret) == sequential load-aware router on 100% of 14k decisions.
#   - that router (greedy_load) = 784s vs Dijkstra 5830s, arr 1.0 both.
#   → BC teacher stays greedy_load. A one-step social tweak is only ~3–8%
#     faster on the nominal alley, so cloning it is not a new result.
#     What the heuristic does not do: reserve the junction for a stream still
#     on another approach, or leave an alley before a scheduled release
#     (residents, school, blockage) that has not started. Those are in the
#     observation. The transition applies them. Every controller shares the draw.
#     A light is only a place: the observation is 1 if the next node has one.
#     Phase and cycle stay in the transition. greedy_load avoids that node
#     when another exit exists. MAPPO has to learn the timing from the delay.
#     ODs are distinct and balanced: paths meet on several streets. The fleet
#     is not forced down one alley and is not required to pass a signal.
#     Local --bc-only test n=8: clone 848s = greedy_load 848s, Dijkstra 5276s.
#   - critic input = global ⊕ own obs (was global only: same V for every agent)
#   - per-agent GAE truncated at that agent's arrival; post-done no-ops dropped
#
#   CUDA_VISIBLE_DEVICES=1 python -u -m marl_agent.mappo_micro_train \
#     --config marl_agent/configs/quan4_mappo_micro.yaml --device cuda

experiment:
  name: quan4_mappo_micro
  data_tag: mappo_micro_v3v
  seed: 42
  device: auto
  output_root: artifacts/out/quan4/marl_runs

data:
  graph: artifacts/out/quan4/wcc/alley_graph_wcc.json
  density: artifacts/out/quan4/wcc/alley_density_l4_cam_wcc.json
  density_by_peak:
    morning: artifacts/out/quan4/wcc/alley_density_peak_morning_paper_a_merged_wcc.json
    afternoon: artifacts/out/quan4/wcc/alley_density_peak_afternoon_paper_a_merged_wcc.json
    evening: artifacts/out/quan4/wcc/alley_density_peak_evening_paper_a_merged_wcc.json
  require_l1_catalog: true
  seeds: ../ingestion-worker/config/od_pairs.quan4.seeds_l3.json
  t_train: [25200, 28800, 32400, 46800, 50400, 61200, 64800, 68400]
  t_eval: [28800, 50400, 64800]
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    min_path_edges: 6
    min_length_m: 400
    require_path: true
    max_pairs: 500

env:
  n_agents: 50
  max_degree: 8
  # One step = one decision. 8192 is the cap before the failure penalty dominates.
  max_steps: 8192
  # Headway ≈ 2.4s, shorter than an alley traversal.
  depart_span_s: 120.0
  # Physical storage. BPR capacity stays 2.5 / 6 / 10; this is how many
  # vehicles fit in the link. Full link → wait at the upstream node.
  jam_spacing_m: 6.0
  # One controlled event per episode, drawn with the episode seed and locked
  # for every controller. egress / school / obstacle. The heuristic does not
  # read the schedule.
  shock_rate: 1.0
  # City seconds per extra vehicle on the link, times 8/capacity.
  # An alley (cap 2.5) costs more to share than a residential street.
  # Added to the reward of whoever enters, heuristic or MAPPO.
  # The fair score is travel + this penalty, for every controller.
  share_coef: 8.0
  # Set false for the ablation: same transition, alley class/cap/density hidden.
  include_alley_info: true
  # Off: banning a turn back made greedy_load 5–7% worse on the objective
  # (it turns away from a jammed alley). That would weaken the baseline.
  no_uturn: false
  # A trip still out after max(min_s, mult · congested trip time) fails on
  # its own and pays the truncation cost. Quận 4: Dijkstra's slowest car took
  # 4.3× its congested time. 10× let lost cars wander 5000–9000s; 6× still
  # clears every baseline (checked on 6 seeds).
  trip_cap_mult: 6.0
  trip_cap_min_s: 1800.0
  # MAPPO training signal only: coef · (time-to-go before − γ · after) per hop.
  # Potential-based, so the optimal policy is unchanged; the compared score
  # (travel + pile penalty) does not include it. Keep shaping_gamma = ppo.gamma.
  progress_shaping: 1.0
  shaping_gamma: 0.999
  # 43 scalars + 8 exits × 20 features = 203, padded.
  compact_dim: 208
  # Seconds (at free-flow pace, scaled by congestion) to turn a motorbike around
  # into the link just left. Paid by every controller; greedy_load forecasts it.
  uturn_delay_s: 5.0
  # Exploration bonus, MAPPO training reward only (not travel, not the score):
  # re-entering a node already visited k >= 2 times costs
  # explore_scale · revisit_penalty_s · (k − 1). A single turn back is free.
  # explore_scale is annealed by ppo.explore_* below.
  revisit_penalty_s: 5.0
  bpr_alpha: 0.15
  bpr_beta: 4.0
  bpr_load_cap: 12.0
  corridor_prob: 0.35
  # travel   = realized traversal time + the shared pile penalty.
  #            This is the reward for every controller, and the compared score.
  # marginal = travel plus the imposed delay a second time (diagnostic only).
  # legacy   = v2h shaped reward (reproduce old runs only)
  reward_mode: travel
  travel_scale: 1000.0
  reward_weights:
    # Every mode. A car still out at the step cap pays
    # base + mult · min(remain_free, cap), added to travel and to the reward.
    # Baselines arrive, so this only ever charges a policy that strands cars.
    truncate_fail_base: 2000.0
    truncate_fail_mult: 4.0
    truncate_remain_cap_s: 3600.0
    # legacy-mode only (ignored by marginal / travel)
    w_T: 1.0
    w_C: 0.35
    w_R: 0.05
    w_step: 0.02
    arrive_bonus: 2.0
    w_progress: 0.4
    w_revisit: 0.25
    w_team: 0.15

model:
  hidden: 256

optim:
  # 3e-5 protected a BC clone. 3e-4 with 8 epochs (v3o, v3q) peaked at
  # update 50 and only got worse after, entropy falling to 0.06.
  lr_actor: 1.0e-4
  lr_critic: 5.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0

bc:
  # Off: do not imitate greedy_load before PPO. The heuristic is an eval baseline.
  enabled: false
  teacher: greedy_load
  updates: 200
  # One episode is already ~1500 decisions (50 cars, staggered). 32 repeats
  # made a single BC update half an hour. 8 still fills the clone.
  episodes_per_update: 8
  holdout_episodes: 4
  lr: 1.0e-3
  # holdout = student-driven, teacher-labelled (closed-loop) accuracy
  target_acc: 0.998
  # DAgger: update u executed by teacher w.p. decay^(u-1), else by the student.
  # Plain BC (teacher states only): acc 0.9993 but closed-loop agree 0.966,
  # arr 0.984, ratio 1.19. DAgger (local, 7 updates): agree 1.000, ratio 1.001.
  dagger_beta_decay: 0.7
  dagger_buffer_updates: 8
  # Do not stop while the teacher still drives most episodes. sol1 stopped at
  # update 3 (beta 0.49, train holdout 0.998) with val agree 0.967 and
  # fleet 1.18× greedy_load. Stop only once beta<=0.15 and the val probe
  # clears the same ratio / agree gates.
  dagger_stop_beta: 0.15
  epochs_per_update: 6
  critic_fit_episodes: 16
  # Val during training, same seeds every eval. 4 episodes spread ~480–810s
  # per episode, too noisy to pick best.pt with min_delta 10s.
  fair_check_episodes: 8
  min_arrival_rate: 0.95
  max_arrival_gap_vs_dijkstra: 0.05
  max_fleet_ratio_vs_teacher: 1.10
  min_closed_loop_agree: 0.95
  # Only used after a clone. Random MAPPO must update the actor from update 1.
  freeze_actor_updates: 0

ppo:
  rollout_episodes: 16
  # sol1 has many CPU cores; collect is env-bound, not GPU-bound.
  n_envs: 16
  use_subproc: true
  minibatch_size: 8192
  # 8 epochs with lr 3e-4 overfit each batch; 4 with lr 1e-4.
  ppo_epochs: 4
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  # Anneal: keep exploring while routes are still being found, then sharpen.
  entropy_coef_start: 0.03
  entropy_coef_end: 0.005
  entropy_anneal_updates: 400
  # Exploration bonus scale 1 -> 0 over 600 updates (explore first, exploit last).
  explore_scale_start: 1.0
  explore_anneal_updates: 600
  # episodes are ~60–200 hops; 0.99 discounted the arrival cost to ~0.13–0.55
  gamma: 0.999
  gae_lambda: 0.95
  normalize_advantage: true

train:
  # ~130s/update on sol1. 2000 bounds a run at ~3 days; early stop usually
  # ends it 500 updates after the best eval.
  max_updates: 2000
  eval_every: 50
  log_every: 1
  save_every: 50

early_stopping:
  enabled: true
  # Evals, not updates. 40 × eval_every 50 kept running ~2000 updates (~3 days)
  # after the best point. 10 = 500 updates without a 10s gain.
  patience: 10
  min_delta: 10.0
  arrival_penalty: 12000.0
  restore_best: true

baseline:
  run_on_eval: true
  # Final paired test. 30 gives a usable 95% CI on the per-episode delta.
  n_episodes: 30
