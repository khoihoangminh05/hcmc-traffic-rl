# Quận 4 — MAPPO multi-agent congestion (MAIN paper train)
# Research lock: .docs/RESEARCH_ONE_PAPER.md
# data_tag: mappo_v1
#
#   CUDA_VISIBLE_DEVICES=1 python -u -m marl_agent.mappo_train \
#     --config marl_agent/configs/quan4_mappo.yaml --device cuda

experiment:
  name: quan4_mappo
  data_tag: mappo_v1
  seed: 42
  device: auto
  output_root: artifacts/out/quan4/marl_runs

data:
  graph: artifacts/out/quan4/wcc/alley_graph_wcc.json
  density: artifacts/out/quan4/wcc/alley_density_l4_cam_wcc.json
  density_by_peak:
    morning: artifacts/out/quan4/wcc/alley_density_peak_morning_paper_a_merged_wcc.json
    afternoon: artifacts/out/quan4/wcc/alley_density_peak_afternoon_paper_a_merged_wcc.json
    evening: artifacts/out/quan4/wcc/alley_density_peak_evening_paper_a_merged_wcc.json
  density_l1_index: artifacts/out/quan4/density/density_l1_index.json
  require_l1_catalog: true
  seeds: ../ingestion-worker/config/od_pairs.quan4.seeds_l3.json
  t_train: [25200, 28800, 32400, 46800, 50400, 61200, 64800, 68400]
  t_eval: [28800, 50400, 64800]
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    min_path_edges: 2
    require_path: true

env:
  n_agents: 16
  k_paths: 8
  compact_dim: 96
  bpr_alpha: 0.15
  bpr_beta: 4.0
  corridor_prob: 0.5
  reward_weights:
    w_T: 1.0
    w_S: 0.35
    w_R: 0.15
    w_F: 0.1
    w_C: 0.25

model:
  hidden: 128
  # IPPO ablation: --ippo sets independent critic

optim:
  lr_actor: 3.0e-4
  lr_critic: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0

ppo:
  rollout_episodes: 128
  ppo_epochs: 4
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.05
  entropy_coef_min: 0.005
  gamma: 1.0
  gae_lambda: 1.0
  normalize_advantage: true

train:
  max_updates: 2000
  eval_every: 20
  log_every: 1
  save_every: 50

early_stopping:
  enabled: true
  metric: val_fleet_mean
  mode: min
  patience: 25
  min_delta: 0.5
  restore_best: true

baseline:
  run_on_eval: true

risk:
  nan_guard: true

viz:
  write_csv: true
  write_jsonl: true
